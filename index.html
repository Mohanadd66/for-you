<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى أجمل إنسانة ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            max-width: 600px;
            width: 100%;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            animation: fadeIn 1.2s ease-in-out;
        }

        h1 {
            color: #e91e63;
            font-size: 2.2rem;
            margin-bottom: 15px;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .gallery {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 25px 0;
        }

        .photo-card {
            background: #fff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border: 2px solid #ffe6e6;
        }

        .photo-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .photo-card p {
            padding: 15px;
            font-size: 1rem;
            color: #444;
            font-weight: 500;
        }

        .btn {
            background: #e91e63;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(233, 30, 99, 0.3);
        }

        .btn:hover {
            background: #c2185b;
            transform: translateY(-2px);
        }

        .hidden-message {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #fff0f5;
            border-radius: 12px;
            border: 1px dashed #e91e63;
            font-size: 1.1rem;
            color: #d81b60;
            line-height: 1.8;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>إلى أرق وأجمل إنسانة ❤️</h1>
        <p class="subtitle">كل لحظة معاكي بتكون ليها طعم تاني.. حبيت أجمع شوية من ذكرياتنا الحلوة مع بعض في الكارت ده!</p>

        <div class="gallery">
            <div class="photo-card">
                <img src="https://picsum.photos/600/400?random=1" alt="ذكرياتنا">
                <p>أحلى الأوقات هي اللي بنقضيها سوا ✨</p>
            </div>
            <div class="photo-card">
                <img src="https://picsum.photos/600/400?random=2" alt="ذكرياتنا">
                <p>ضحكتك دايماً بتنور يومي 🌸</p>
            </div>
        </div>

        <button class="btn" onclick="showMessage()">اضغطي هنا للمفاجأة 💌</button>

        <div class="hidden-message" id="message">
            شكراً إنك موجودة في حياتي، وربنا يديمك ليا ويخليكي ليا على طول يا أجمل حاجة حصلتلي! ❤️✨
        </div>
    </div>

    <script>
        function showMessage() {
            var msg = document.getElementById('message');
            if (msg.style.display === 'block') {
                msg.style.display = 'none';
            } else {
                msg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
